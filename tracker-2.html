  #splash.gone { display: none; }

  :root[data-theme="dark"] {
    --bg:#111110;--surface:#1c1c1a;--surface2:#252522;--border:#2e2e2b;
    --text:#f0f0ec;--text-2:#9b9b96;--text-3:#6b6b67;
    --accent:#52b788;--accent-light:#1a2f24;--accent-text:#74c99e;

  .header{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;gap:10px;}
  .header h1{font-size:16px;font-weight:600;letter-spacing:-0.02em;}

  .date-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .date-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:13px;font-family:'DM Mono',monospace;color:var(--text);outline:none;transition:border-color .15s;flex:1;min-width:0;}
  .date-input:focus{border-color:var(--accent);}
  .date-label{font-size:12px;color:var(--text-3);white-space:nowrap;}

  .session-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;-webkit-overflow-scrolling:touch;}

  .session-tab{flex-shrink:0;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:'DM Sans',sans-serif;line-height:1.4;text-align:center;}
  .session-tab:hover{border-color:var(--accent);color:var(--text);}
  .session-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* Session notes */
  .session-note-wrap{margin-bottom:10px;}

  .note-save-btn{margin-top:5px;padding:5px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}

  .sets-header{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:5px;font-size:10px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;border-bottom:1px solid var(--border);}
  .set-row{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:5px;align-items:center;touch-action:pan-y;}

  .nav-btn{flex:1;padding:9px 4px;border:none;background:none;color:var(--text-3);font-size:10px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s;}
  .nav-btn.active{color:var(--accent);}

  /* History */
  .history-section{display:none;}
  .history-section.visible{display:block;}
  .workout-section.hidden{display:none;}
  .week-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .week-nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 11px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:'DM Sans',sans-serif;}

// State
let activeSession = 0;
let activeView = 'workout';
let weekLogs = {};

let historyWeekOffset = 0;
let selectedDate = new Date().toISOString().slice(0,10);

// ── Supabase ──────────────────────────────────────────────
async function dbq(table, params='') {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'}
    });
    if (!r.ok) throw new Error(await r.text());
    return await r.json();
  } catch(e){console.error(e);return null;}
}
async function dbupsert(table, data, conflict) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflict}`, {
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(data)
    });
    return r.ok;
  } catch(e){console.error(e);return false;}
}

// ── Custom exercises ──────────────────────────────────────
function loadCustom(){try{return JSON.parse(localStorage.getItem('cx2')||'{}');}catch{return {};}}
function saveCustom(d){try{localStorage.setItem('cx2',JSON.stringify(d));}catch{}}
function getExercises(si){const c=loadCustom();const key=PROGRAM[si].id;return[...PROGRAM[si].exercises,...(c[key]||[])];}
function addCustom(si,ex){const c=loadCustom();const key=PROGRAM[si].id;if(!c[key])c[key]=[];c[key].push(ex);saveCustom(c);}
function removeCustom(si,name){const c=loadCustom();const key=PROGRAM[si].id;if(!c[key])return;c[key]=c[key].filter(e=>e.name!==name);saveCustom(c);}

// ── Session notes (localStorage) ─────────────────────────
function noteKey(){return `note-${PROGRAM[activeSession].id}-${selectedDate}`;}
function loadNote(){try{return localStorage.getItem(noteKey())||'';}catch{return '';}}
function saveNote(txt){try{localStorage.setItem(noteKey(),txt);}catch{}}

// ── Date helpers ─────────────────────────────────────────
function dateKey(){return selectedDate;}
function prevSameDate(){const d=new Date(selectedDate);d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);}
function getWeekStart(offset=0){
  const now=new Date();const day=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-((day+6)%7)+(offset*7));
  return mon.toISOString().slice(0,10);
}

// ── Load logs ─────────────────────────────────────────────
async function loadDateLogs(date, target) {
  const data = await dbq('workout_logs',`?workout_date=eq.${date}&select=exercise_name,set_number,weight_kg,reps_done`);
  if (!data) return;
  const result={};
  for (const row of data) {
    if (!result[row.exercise_name]) result[row.exercise_name]=[];
    result[row.exercise_name][row.set_number-1]={weight:row.weight_kg||'',reps:row.reps_done||''};
  }
  if (target==='current') weekLogs=result;
  else prevWeekLogs=result;
}

// ── Build workout view ────────────────────────────────────
function buildWorkout() {
  const session=PROGRAM[activeSession];
  const allEx=getExercises(activeSession);
  const savedNote=loadNote();

  let html=`<div class="session-title">${session.label}</div>
  <div class="session-note-wrap">
    <textarea class="session-note" id="session-note" rows="2" placeholder="Session notes — how you felt, energy level, anything notable…">${savedNote}</textarea>
    <button class="note-save-btn" onclick="saveSessionNote()">Save note</button>
  </div>`;

  allEx.forEach((ex,ei)=>{
    const isCustom=ei>=PROGRAM[activeSession].exercises.length;
    const prev=prevWeekLogs[ex.name]||[];
    const cur=weekLogs[ex.name]||[];
    const extraKey=`${session.id}-${ex.name}`;
    const loggedCount=cur.filter(Boolean).length;
    const totalSets=Math.max(ex.sets,loggedCount,extraSets[extraKey]||0);

    // Copy last week button — only if prev has data
    const prevHasData=prev.some(s=>s&&(s.weight||s.reps));
    const copyBtn=prevHasData
      ?`<button class="copy-weights-btn" id="copy-${ei}" onclick="copyLastWeek(${ei})">↙ Copy last week's weights</button>`
      :'';

    let setsHtml='';
    for(let s=0;s<totalSets;s++){
      const c=cur[s]||{};
      setsHtml+=`<div class="set-row" id="row-${ei}-${s}">
        <div class="set-num">${s+1}</div>
        <input class="set-input" type="number" inputmode="decimal" placeholder="kg" data-ei="${ei}" data-s="${s}" data-f="weight" value="${c.weight||''}">
        <input class="set-input" type="number" inputmode="numeric" placeholder="${ex.reps}" data-ei="${ei}" data-s="${s}" data-f="reps" value="${c.reps||''}">
        <div class="set-done${c.done?' checked':''}" data-ei="${ei}" data-s="${s}">${c.done?'✓':''}</div>
      </div>`;
    }

    // Week comparison
    const prevBest=prev.reduce((m,s)=>s&&parseFloat(s.weight)>m?parseFloat(s.weight):m,0);
    const curBest=cur.reduce((m,s)=>s&&parseFloat(s.weight)>m?parseFloat(s.weight):m,0);
    let compareHtml='';
    if(prevBest>0){
      let cls='',arrow='→',chip='';
      if(curBest>0){
        if(curBest>prevBest){cls='up';arrow='↑';chip=`<span class="pr-chip up">PR +${(curBest-prevBest).toFixed(1)}kg</span>`;}
        else if(curBest===prevBest){cls='same';arrow='=';chip=`<span class="pr-chip same">Same</span>`;}
        else{cls='down';arrow='↓';chip=`<span class="pr-chip down">↓${(prevBest-curBest).toFixed(1)}kg</span>`;}
      }
      compareHtml=`<div class="week-compare ${cls}" id="cmp-${ei}">
        <div class="week-compare-left"><div class="week-compare-label">Last week</div><div class="week-compare-val">${prevBest}kg</div></div>
        <div class="week-compare-arrow">${arrow}</div>
        <div class="week-compare-left" style="text-align:right"><div class="week-compare-label">This week ${chip}</div><div class="week-compare-val">${curBest>0?curBest+'kg':'—'}</div></div>
      </div>`;
    }

    const delBtn=isCustom?`<button class="delete-ex-btn" onclick="event.stopPropagation();delCustom('${ex.name.replace(/'/g,"\\'")}')">✕</button>`:'';

    html+=`<div class="exercise-card" id="ex-${ei}">
      <div class="exercise-header" onclick="toggleEx(${ei})">
        <div class="exercise-name">${ex.name}${isCustom?'<span class="custom-badge">custom</span>':''}</div>
        <div class="exercise-meta">${ex.sets}×${ex.reps}${ex.note?' · '+ex.note:''}</div>
        ${delBtn}
        <div class="exercise-arrow">▾</div>
      </div>
      <div class="exercise-body">
        ${copyBtn}
        <div class="sets-header"><div style="text-align:center">Set</div><div style="text-align:center">kg</div><div style="text-align:center">Reps</div><div style="text-align:center">✓</div></div>
        <div class="sets-list" id="sets-${ei}">${setsHtml}</div>
        <button class="add-set-btn" onclick="addSet(${ei})">+ Add set</button>
        ${compareHtml}
        <button class="save-btn" onclick="saveEx(${ei},this)">Save</button>
      </div>
    </div>`;
  });

  html+=`<button class="add-exercise-btn" onclick="openModal()">+ Add exercise</button>`;
  document.getElementById('workout-content').innerHTML=html;
  wireInputs();
}

function wireInputs(){
  document.querySelectorAll('.set-input').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const ei=+e.target.dataset.ei,s=+e.target.dataset.s,f=e.target.dataset.f;
      const name=getExercises(activeSession)[ei].name;
      if(!weekLogs[name])weekLogs[name]=[];
      if(!weekLogs[name][s])weekLogs[name][s]={};
      weekLogs[name][s][f]=e.target.value;
      updateCompare(ei);
    });
  });
  document.querySelectorAll('.set-done').forEach(btn=>{
    wireSetDone(btn);
    // Swipe gesture
    addSwipe(btn);
  });
}

function wireSetDone(btn){
  btn.addEventListener('click',e=>{
    const ei=+e.target.dataset.ei,s=+e.target.dataset.s;
    const name=getExercises(activeSession)[ei].name;
    if(!weekLogs[name])weekLogs[name]=[];
    if(!weekLogs[name][s])weekLogs[name][s]={};
    const done=!weekLogs[name][s].done;
    weekLogs[name][s].done=done;
    e.target.classList.toggle('checked',done);
    e.target.textContent=done?'✓':'';
  });
}

// ── Swipe-to-check ────────────────────────────────────────
function addSwipe(el){
  let startX=null;
  const row=el.closest('.set-row');
  el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;},{passive:true});
  el.addEventListener('touchmove',e=>{
    if(startX===null)return;
    const dx=e.touches[0].clientX-startX;
    if(dx>30&&row)row.classList.add('swiping');
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(startX===null)return;
    const dx=e.changedTouches[0].clientX-startX;
    if(row)row.classList.remove('swiping');
    if(dx>50){el.click();}
    startX=null;
  });
}

// ── Copy last week's weights ──────────────────────────────
function copyLastWeek(ei){
  const ex=getExercises(activeSession)[ei];
  const prev=prevWeekLogs[ex.name]||[];
  if(!weekLogs[ex.name])weekLogs[ex.name]=[];
  prev.forEach((p,s)=>{
    if(!p)return;
    if(!weekLogs[ex.name][s])weekLogs[ex.name][s]={};
    weekLogs[ex.name][s].weight=p.weight;
    weekLogs[ex.name][s].reps=p.reps;
    // update DOM
    const wInp=document.querySelector(`.set-input[data-ei="${ei}"][data-s="${s}"][data-f="weight"]`);
    const rInp=document.querySelector(`.set-input[data-ei="${ei}"][data-s="${s}"][data-f="reps"]`);
    if(wInp)wInp.value=p.weight||'';
    if(rInp)rInp.value=p.reps||'';
  });
  updateCompare(ei);
  const btn=document.getElementById(`copy-${ei}`);
  if(btn){btn.textContent='✓ Copied';btn.disabled=true;setTimeout(()=>{btn.textContent='↙ Copy last week\'s weights';btn.disabled=false;},1800);}
}

function addSet(ei){
  const session=PROGRAM[activeSession];
  const ex=getExercises(activeSession)[ei];
  const extraKey=`${session.id}-${ex.name}`;
  const cur=weekLogs[ex.name]||[];
  const loggedCount=cur.filter(Boolean).length;
  const currentTotal=Math.max(ex.sets,loggedCount,extraSets[extraKey]||0);
  extraSets[extraKey]=currentTotal+1;
  const newS=currentTotal;

  const list=document.getElementById(`sets-${ei}`);
  const row=document.createElement('div');
  row.className='set-row';
  row.id=`row-${ei}-${newS}`;
  row.innerHTML=`
    <div class="set-num">${newS+1}</div>
    <input class="set-input" type="number" inputmode="decimal" placeholder="kg" data-ei="${ei}" data-s="${newS}" data-f="weight" value="">
    <input class="set-input" type="number" inputmode="numeric" placeholder="${ex.reps}" data-ei="${ei}" data-s="${newS}" data-f="reps" value="">
    <div class="set-done" data-ei="${ei}" data-s="${newS}"></div>
  `;
  list.appendChild(row);
  row.querySelectorAll('.set-input').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const eiN=+e.target.dataset.ei,sN=+e.target.dataset.s,f=e.target.dataset.f;
      const name=getExercises(activeSession)[eiN].name;
      if(!weekLogs[name])weekLogs[name]=[];
      if(!weekLogs[name][sN])weekLogs[name][sN]={};
      weekLogs[name][sN][f]=e.target.value;
      updateCompare(eiN);
    });
  });
  const doneBtn=row.querySelector('.set-done');
  wireSetDone(doneBtn);
  addSwipe(doneBtn);
}

function updateCompare(ei){
  const ex=getExercises(activeSession)[ei];
  const cur=weekLogs[ex.name]||[];
  const prev=prevWeekLogs[ex.name]||[];
  const prevBest=prev.reduce((m,s)=>s&&parseFloat(s.weight)>m?parseFloat(s.weight):m,0);
  const curBest=cur.reduce((m,s)=>s&&parseFloat(s.weight)>m?parseFloat(s.weight):m,0);
  const el=document.getElementById(`cmp-${ei}`);
  if(!el||prevBest===0)return;
  let cls='',arrow='→',chip='';
  if(curBest>0){
    if(curBest>prevBest){cls='up';arrow='↑';chip=`<span class="pr-chip up">PR +${(curBest-prevBest).toFixed(1)}kg</span>`;}
    else if(curBest===prevBest){cls='same';arrow='=';chip=`<span class="pr-chip same">Same</span>`;}
    else{cls='down';arrow='↓';chip=`<span class="pr-chip down">↓${(prevBest-curBest).toFixed(1)}kg</span>`;}
  }
  el.className=`week-compare ${cls}`;
  el.innerHTML=`
    <div class="week-compare-left"><div class="week-compare-label">Last week</div><div class="week-compare-val">${prevBest}kg</div></div>
    <div class="week-compare-arrow">${arrow}</div>
    <div class="week-compare-left" style="text-align:right"><div class="week-compare-label">This week ${chip}</div><div class="week-compare-val">${curBest>0?curBest+'kg':'—'}</div></div>
  `;
}

function toggleEx(ei){document.getElementById(`ex-${ei}`).classList.toggle('open');}

function saveSessionNote(){
  const txt=document.getElementById('session-note').value.trim();
  saveNote(txt);
  showToast('Note saved');
}

async function saveEx(ei,btn){
  const session=PROGRAM[activeSession];
  const ex=getExercises(activeSession)[ei];
  const sets=weekLogs[ex.name]||[];
  btn.disabled=true;btn.textContent='Saving…';
  const rows=[];
  const totalSets=Math.max(ex.sets,sets.filter(Boolean).length);
  for(let s=0;s<totalSets;s++){
    const set=sets[s]||{};
    if(set.weight||set.reps){
      rows.push({workout_date:dateKey(),session_label:session.label,exercise_name:ex.name,set_number:s+1,weight_kg:parseFloat(set.weight)||null,reps_done:parseInt(set.reps)||null});
    }
  }
  if(!rows.length){showToast('Enter at least one set');btn.disabled=false;btn.textContent='Save';return;}
  const ok=await dbupsert('workout_logs',rows,'workout_date,exercise_name,set_number');
  if(ok){showToast('Saved ✓');btn.textContent='Saved ✓';setTimeout(()=>{btn.disabled=false;btn.textContent='Save';},2000);}
  else{showToast('Error — check connection');btn.disabled=false;btn.textContent='Save';}
}

// ── History ───────────────────────────────────────────────
async function buildHistory(){
  const weekStart=getWeekStart(historyWeekOffset);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);
  document.getElementById('history-week-label').textContent=`${weekStart.slice(5)} – ${weekEnd.toISOString().slice(5,10)}`;

  const endKey=new Date(weekStart);endKey.setDate(endKey.getDate()+7);
  const endStr=endKey.toISOString().slice(0,10);

  const [data,prevData]=await Promise.all([
    dbq('workout_logs',`?workout_date=gte.${weekStart}&workout_date=lt.${endStr}&select=exercise_name,set_number,weight_kg,reps_done,session_label,workout_date&order=workout_date`),
    dbq('workout_logs',`?workout_date=gte.${getWeekStart(historyWeekOffset-1)}&workout_date=lt.${weekStart}&select=exercise_name,weight_kg,reps_done,workout_date`)
  ]);

  const rows=data||[];
  const prevRows=prevData||[];

  // Prev week bests
  const prevBests={};
  for(const r of prevRows){
    if(!prevBests[r.exercise_name]||r.weight_kg>prevBests[r.exercise_name])prevBests[r.exercise_name]=r.weight_kg;
  }

  // Volume chart: total kg per day
  drawVolumeChart(rows,weekStart);

  // Streak: which sessions logged each of last 8 weeks
  buildStreaks(weekStart);

  // Sessions
  const bySession={};
  for(const r of rows){
    const k=`${r.workout_date}|${r.session_label}`;
    if(!bySession[k])bySession[k]={date:r.workout_date,label:r.session_label,exercises:{}};
    if(!bySession[k].exercises[r.exercise_name])bySession[k].exercises[r.exercise_name]=[];
    bySession[k].exercises[r.exercise_name].push(r);
  }

  let html='';
  if(!Object.keys(bySession).length){
    html='<div class="empty-state">No workouts logged this week</div>';
  } else {
    for(const [,s] of Object.entries(bySession)){
      let exRows='';
      for(const [exName,sets] of Object.entries(s.exercises)){
        const best=Math.max(...sets.map(x=>x.weight_kg||0));
        const prev=prevBests[exName];
        let chip='';
        if(prev&&best>0){
          if(best>prev)chip=`<span class="pr-chip up">↑ PR</span>`;
          else if(best===prev)chip=`<span class="pr-chip same">= Same</span>`;
          else chip=`<span class="pr-chip down">↓${(prev-best).toFixed(1)}kg</span>`;
        }
        exRows+=`<div class="history-row"><div class="history-row-name">${exName}${chip}</div><div class="history-row-val">${sets.length}× best ${best>0?best+'kg':'—'}</div></div>`;
      }
      // Show session note if any
      const noteStorageKey=`note-${PROGRAM.find(p=>p.label===s.label)?.id||''}-${s.date}`;
      let noteHtml='';
      try{const n=localStorage.getItem(noteStorageKey);if(n)noteHtml=`<div class="history-note">"${n}"</div>`;}catch{}
      html+=`<div class="history-card">
        <div class="history-card-header" onclick="this.parentElement.classList.toggle('open')">
          <div>
            <div class="history-card-title">${s.label}</div>
            <div class="history-card-date">${s.date}</div>
          </div>
          <div class="exercise-arrow">▾</div>
        </div>
        <div class="history-card-body">${exRows}${noteHtml}</div>
      </div>`;
    }
  }
  document.getElementById('history-content').innerHTML=html;
}

// ── Volume chart ──────────────────────────────────────────
function drawVolumeChart(rows,weekStart){
  const canvas=document.getElementById('vol-chart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||300;
  canvas.width=W*2;canvas.height=240;
  ctx.scale(2,2);
  const cW=W,cH=120;

  // total vol per day
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const vols=new Array(7).fill(0);
  for(const r of rows){
    const d=new Date(r.workout_date+'T12:00:00');
    const ws=new Date(weekStart+'T12:00:00');
    const diff=Math.round((d-ws)/(86400000));
    if(diff>=0&&diff<7&&r.weight_kg&&r.reps_done)vols[diff]+=(r.weight_kg*r.reps_done);
  }
  const maxVol=Math.max(...vols,1);

  // styles — read CSS vars
  const st=getComputedStyle(document.documentElement);
  const clrAccent=st.getPropertyValue('--accent').trim()||'#2d6a4f';
  const clrBg=st.getPropertyValue('--surface2').trim()||'#f2f2f0';
  const clrText2=st.getPropertyValue('--text-2').trim()||'#6b6b67';
  const clrBorder=st.getPropertyValue('--border').trim()||'#e5e5e2';

  const padL=8,padR=8,padT=8,padB=26;
  const chartW=cW-padL-padR;
  const chartH=cH-padT-padB;
  const barW=Math.floor(chartW/7)-4;

  ctx.clearRect(0,0,cW,cH);

  // grid line
  ctx.strokeStyle=clrBorder;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(padL,padT+chartH);ctx.lineTo(padL+chartW,padT+chartH);ctx.stroke();

  vols.forEach((v,i)=>{
    const x=padL+i*(chartW/7)+2;
    const barH=v>0?Math.max(4,Math.round((v/maxVol)*chartH)):0;
    const y=padT+chartH-barH;

    // bar
    ctx.fillStyle=v>0?clrAccent:clrBg;
    const r=3;
    if(barH>0){
      ctx.beginPath();
      ctx.moveTo(x+r,y);ctx.lineTo(x+barW-r,y);
      ctx.quadraticCurveTo(x+barW,y,x+barW,y+r);
      ctx.lineTo(x+barW,y+barH);ctx.lineTo(x,y+barH);ctx.lineTo(x,y+r);
      ctx.quadraticCurveTo(x,y,x+r,y);
      ctx.fill();
    } else {
      ctx.fillRect(x,padT+chartH-2,barW,2);
    }

    // label
    ctx.fillStyle=clrText2;ctx.font='500 9px DM Sans,system-ui';ctx.textAlign='center';
    ctx.fillText(days[i],x+barW/2,cH-8);

    // value
    if(v>0){
      ctx.fillStyle=clrText2;ctx.font='500 8px DM Mono,monospace';
      const label=v>=1000?`${(v/1000).toFixed(1)}t`:`${Math.round(v)}`;
      ctx.fillText(label,x+barW/2,y-3);
    }
  });
}

// ── Streak tracker ────────────────────────────────────────
async function buildStreaks(currentWeekStart){
  // Fetch 8 weeks of logs to compute streaks per session
  const eightBack=new Date(currentWeekStart);eightBack.setDate(eightBack.getDate()-7*7);
  const eightBackStr=eightBack.toISOString().slice(0,10);
  const endStr=new Date(currentWeekStart);endStr.setDate(endStr.getDate()+7);
  const data=await dbq('workout_logs',`?workout_date=gte.${eightBackStr}&workout_date=lt.${endStr.toISOString().slice(0,10)}&select=session_label,workout_date`) || [];

  // Which sessions were done each week (by week-start Monday)
  const sessionWeeks={};
  for(const r of data){
    const d=new Date(r.workout_date+'T12:00:00');
    const dow=d.getDay();
    const mon=new Date(d);mon.setDate(d.getDate()-((dow+6)%7));
    const wk=mon.toISOString().slice(0,10);
    if(!sessionWeeks[r.session_label])sessionWeeks[r.session_label]=new Set();
    sessionWeeks[r.session_label].add(wk);
  }

  // Compute streak for each program session
  const chips=PROGRAM.map(s=>{
    const weeks=sessionWeeks[s.label]||new Set();
    let streak=0;
    for(let o=0;o>=-8;o--){
      const wk=getWeekStart(historyWeekOffset+o);
      if(weeks.has(wk))streak++;
      else break;
    }
    const isActive=streak>0;
    const fire=streak>=3?'🔥':streak>=2?'✦':'·';
    return `<div class="streak-chip${isActive?' active':''}"><span class="fire">${fire}</span>${s.label.split('·')[0].trim()} <strong>${streak}w</strong></div>`;
  }).join('');

  document.getElementById('streak-row').innerHTML=chips;
}

// ── Cardio ────────────────────────────────────────────────
const CARDIO_TYPES = ['Treadmill', 'Incline Walk', 'Run', 'Bike', 'Stairmaster', 'Other'];
let cardioType = 'Treadmill';

function loadCardioLogs() {
  try { return JSON.parse(localStorage.getItem('cardio-logs') || '[]'); } catch { return []; }
}
function saveCardioLogs(logs) {
  try { localStorage.setItem('cardio-logs', JSON.stringify(logs)); } catch {}
}

function buildCardio() {
  const logs = loadCardioLogs();
  // Week total (this Mon–Sun)
  const ws = getWeekStart(0);
  const we = new Date(ws); we.setDate(we.getDate() + 7);
  const weStr = we.toISOString().slice(0, 10);
  const weekLogs = logs.filter(l => l.date >= ws && l.date < weStr);
  const weekMins = weekLogs.reduce((s, l) => s + (parseFloat(l.duration) || 0), 0);
  const weekKm = weekLogs.reduce((s, l) => s + (parseFloat(l.distance) || 0), 0);

  const typeButtons = CARDIO_TYPES.map(t =>
    `<button class="cardio-type-btn${t === cardioType ? ' active' : ''}" onclick="setCardioType('${t}')">${t}</button>`
  ).join('');

  const weekTotalHtml = weekMins > 0
    ? `<div class="cardio-week-total">
        <div class="cardio-week-total-label">This week</div>
        <div class="cardio-week-total-val">${weekMins} min${weekKm > 0 ? ' · ' + weekKm.toFixed(1) + ' km' : ''}</div>
       </div>` : '';

  const logCards = logs.slice().reverse().slice(0, 20).map((l, ri) => {
    const i = logs.length - 1 - ri;
    const stats = [
      l.duration ? `<div class="cardio-stat"><div class="cardio-stat-val">${l.duration}</div><div class="cardio-stat-label">min</div></div>` : '',
      l.distance ? `<div class="cardio-stat"><div class="cardio-stat-val">${l.distance}</div><div class="cardio-stat-label">km</div></div>` : '',
      l.speed ? `<div class="cardio-stat"><div class="cardio-stat-val">${l.speed}</div><div class="cardio-stat-label">km/h</div></div>` : '',
      l.incline ? `<div class="cardio-stat"><div class="cardio-stat-val">${l.incline}%</div><div class="cardio-stat-label">incline</div></div>` : '',
    ].join('');
    return `<div class="cardio-log-card">
      <div class="cardio-log-left">
        <div class="cardio-log-type">${l.type}</div>
        <div class="cardio-log-date">${l.date}</div>
        <div class="cardio-log-stats">${stats}</div>
      </div>
      <button class="cardio-delete" onclick="deleteCardio(${i})">✕</button>
    </div>`;
  }).join('');

  document.getElementById('cardio-content').innerHTML = `
    ${weekTotalHtml}
    <div class="cardio-form">
      <div class="cardio-form-title">Log cardio</div>
      <div class="cardio-type-row">${typeButtons}</div>
      <div class="cardio-fields">
        <div class="cardio-field">
          <label class="cardio-label">Duration (min)</label>
          <input class="cardio-input" id="c-duration" type="number" inputmode="decimal" placeholder="30">
        </div>
        <div class="cardio-field">
          <label class="cardio-label">Distance (km)</label>
          <input class="cardio-input" id="c-distance" type="number" inputmode="decimal" placeholder="3.5">
        </div>
        <div class="cardio-field">
          <label class="cardio-label">Speed (km/h)</label>
          <input class="cardio-input" id="c-speed" type="number" inputmode="decimal" placeholder="8.0">
        </div>
        <div class="cardio-field">
          <label class="cardio-label">Incline (%)</label>
          <input class="cardio-input" id="c-incline" type="number" inputmode="decimal" placeholder="1.0">
        </div>
        <div class="cardio-field full">
          <label class="cardio-label">Date</label>
          <input class="cardio-input" id="c-date" type="date" value="${selectedDate}">
        </div>
      </div>
      <button class="save-btn" onclick="saveCardio()">Log session</button>
    </div>
    <div class="cardio-log-list">${logCards || '<div class="empty-state">No cardio logged yet</div>'}</div>
  `;
}

function setCardioType(t) {
  cardioType = t;
  document.querySelectorAll('.cardio-type-btn').forEach(b => b.classList.toggle('active', b.textContent === t));
}

function saveCardio() {
  const duration = document.getElementById('c-duration').value.trim();
  const distance = document.getElementById('c-distance').value.trim();
  const speed = document.getElementById('c-speed').value.trim();
  const incline = document.getElementById('c-incline').value.trim();
  const date = document.getElementById('c-date').value || selectedDate;
  if (!duration && !distance) { showToast('Enter duration or distance'); return; }
  const logs = loadCardioLogs();
  logs.push({ type: cardioType, date, duration, distance, speed, incline });
  saveCardioLogs(logs);
  showToast('Cardio logged ✓');
  buildCardio();
}

function deleteCardio(i) {
  const logs = loadCardioLogs();
  logs.splice(i, 1);
  saveCardioLogs(logs);
  buildCardio();
}

// ── CSV Export ────────────────────────────────────────────
async function exportCSV(){
  const weekStart=getWeekStart(historyWeekOffset);
  const endKey=new Date(weekStart);endKey.setDate(endKey.getDate()+7);
  const data=await dbq('workout_logs',`?workout_date=gte.${weekStart}&workout_date=lt.${endKey.toISOString().slice(0,10)}&select=workout_date,session_label,exercise_name,set_number,weight_kg,reps_done&order=workout_date,session_label,exercise_name,set_number`) || [];
  if(!data.length){showToast('No data to export');return;}
  const header='Date,Session,Exercise,Set,Weight (kg),Reps\n';
  const rows=data.map(r=>`${r.workout_date},"${r.session_label}","${r.exercise_name}",${r.set_number},${r.weight_kg??''},${r.reps_done??''}`).join('\n');
  const blob=new Blob([header+rows],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`workouts-${weekStart}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('CSV downloaded ✓');
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

async function switchView(view){
  activeView=view;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`nav-${view}`).classList.add('active');
  document.getElementById('workout-section').classList.toggle('hidden', view!=='workout');
  document.getElementById('history-section').classList.toggle('visible', view==='history');
  document.getElementById('cardio-section').classList.toggle('visible', view==='cardio');
  if(view==='history') await buildHistory();
  if(view==='cardio') buildCardio();
}

async function init(){
  document.getElementById('workout-date').value=selectedDate;
  const tabs=document.getElementById('session-tabs');
  tabs.innerHTML=PROGRAM.map((s,i)=>
    `<button class="session-tab${i===activeSession?' active':''}" onclick="selectSession(${i})">${s.day}<br><span style="font-size:10px;opacity:.8">${s.label.split('·')[0].trim()}</span></button>`
  ).join('');
  await Promise.all([loadDateLogs(selectedDate,'current'),loadDateLogs(prevSameDate(),'prev')]);
  buildWorkout();
  // Dismiss splash after load
  setTimeout(()=>{
    const sp=document.getElementById('splash');
    sp.classList.add('fade-out');
    setTimeout(()=>sp.classList.add('gone'),650);
  },1600);
}

function autoSelectToday(){
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=days[new Date().getDay()];
  // Find first session matching today
  const idx=PROGRAM.findIndex(p=>p.day===today);
  if(idx>=0) activeSession=idx;
}
