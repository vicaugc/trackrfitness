<!DOCTYPE html>
<html lang="en">
<head>
<title>theWorkout TRACKR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TRACKR">
<meta name="theme-color" content="#F5F0E8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #F5F0E8;
  --surface: #FFFFFF;
  --surface2: #F0EBE1;
  --border: #E2D9CC;
  --text: #1A1008;
  --text-2: #6B5E4E;
  --text-3: #9E8E7E;
  --accent: #7B1F2E;
  --accent-light: #F5E8EA;
  --accent-text: #FFFFFF;
  --up: #7B1F2E;
  --up-bg: #F5E8EA;
  --same: #9E8E7E;
  --same-bg: #F0EBE1;
  --down: #B05A38;
  --down-bg: #FAF0EB;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 4px rgba(26,16,8,.06), 0 2px 12px rgba(26,16,8,.04);
  --shadow-sm: 0 1px 3px rgba(26,16,8,.08);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;}
body{padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 72px);max-width:560px;margin:0 auto;}

/* ── Splash ── */
#splash{position:fixed;inset:0;z-index:999;background:#3D0F18;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 10vw;transition:opacity .6s ease;}
#splash.fade-out{opacity:0;pointer-events:none;}
#splash.gone{display:none;}
.splash-lockup{line-height:1;margin-bottom:18px;}
.splash-the{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(28px,8vw,52px);color:#fff;display:block;letter-spacing:-.01em;}
.splash-workout{font-family:'Playfair Display',Georgia,serif;font-style:normal;font-weight:900;font-size:clamp(44px,13vw,84px);color:#fff;display:block;letter-spacing:-.03em;margin-top:-4px;}
.splash-trackr{font-family:'Playfair Display',Georgia,serif;font-style:normal;font-weight:900;font-size:clamp(52px,16vw,104px);color:#fff;display:block;letter-spacing:-.04em;margin-top:-8px;}
.splash-sub{display:flex;align-items:center;gap:14px;margin-top:10px;}
.splash-byline{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:clamp(13px,3.5vw,17px);color:#fff;letter-spacing:.01em;}
.splash-rule{flex:1;height:1px;background:rgba(255,255,255,.35);}
.splash-meta{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:10vw;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);line-height:1.6;}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;gap:10px;}
.header-title{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:900;letter-spacing:-.03em;color:var(--text);}
.header-right{display:flex;align-items:center;gap:8px;}
.header-brand{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);}
.header-heart{font-size:16px;color:var(--text-3);}

/* ── Date row ── */
.date-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.date-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-family:'DM Mono',monospace;color:var(--text);outline:none;transition:border-color .15s;flex:1;min-width:0;box-shadow:var(--shadow-sm);}
.date-input:focus{border-color:var(--accent);}
.date-label{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;}

/* ── Session tabs ── */
.session-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:14px;-webkit-overflow-scrolling:touch;}
.session-tabs::-webkit-scrollbar{display:none;}
.session-tab{flex-shrink:0;min-width:76px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-align:center;box-shadow:var(--shadow-sm);}
.session-tab:hover{border-color:var(--accent);color:var(--text);}
.session-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tab-day-abbr{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;opacity:.8;display:block;margin-bottom:2px;}
.tab-day-num{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;line-height:1;display:block;margin-bottom:2px;}
.tab-session-name{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;opacity:.7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px;}

/* ── Session hero ── */
.session-hero{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.session-hero-name{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:900;color:var(--text);line-height:1.1;}
.session-hero-meta{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-top:4px;}
.session-hero-date{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);text-align:right;padding-top:4px;}

/* ── Exercise cards ── */
.exercise-card-wrap{position:relative;overflow:hidden;border-radius:var(--radius);margin-bottom:8px;}
.swipe-reveal{position:absolute;inset:0;right:auto;width:100%;background:var(--up-bg);display:flex;align-items:center;justify-content:flex-end;padding-right:20px;gap:8px;border-radius:var(--radius);pointer-events:none;opacity:0;}
.swipe-reveal-label{font-size:12px;font-weight:600;color:var(--up);letter-spacing:.05em;text-transform:uppercase;}
.swipe-reveal-icon{font-size:20px;color:var(--up);}
.exercise-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;z-index:1;transition:transform .0s,opacity .3s;will-change:transform;box-shadow:var(--shadow);}
.exercise-card.swiping-out{transition:transform .25s ease,opacity .25s ease;transform:translateX(-100%);opacity:0;}
.exercise-card.done-card{border-color:var(--up-bg);background:var(--up-bg);}
.exercise-header{display:flex;align-items:center;padding:13px 14px;cursor:pointer;gap:10px;user-select:none;}
.ex-num-badge{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-3);flex-shrink:0;transition:all .15s;}
.exercise-card.open .ex-num-badge{background:var(--accent);color:#fff;border-color:var(--accent);}
.ex-header-info{flex:1;min-width:0;}
.exercise-name{font-size:14px;font-weight:500;color:var(--text);letter-spacing:-.01em;}
.exercise-muscles{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-top:2px;}
.ex-header-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.ex-sets-label{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);text-align:right;}
.ex-progress-label{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text-3);text-align:right;}
.exercise-card.open .ex-progress-label{display:none;}
.exercise-arrow{color:var(--text-3);font-size:18px;transition:transform .2s;margin-left:2px;flex-shrink:0;font-weight:300;}
.exercise-card.open .exercise-arrow{transform:rotate(90deg);}
.exercise-body{display:none;padding:0 14px 14px;flex-direction:column;gap:8px;}
.exercise-card.open .exercise-body{display:flex;}

/* Done badge */
.done-badge{display:none;font-size:11px;font-weight:600;color:var(--up);background:var(--up-bg);border-radius:20px;padding:2px 9px;letter-spacing:.04em;flex-shrink:0;}
.exercise-card.done-card .done-badge{display:inline-flex;align-items:center;gap:4px;}
.exercise-card.done-card .exercise-arrow{display:none;}
.exercise-card.done-card .exercise-header{cursor:default;opacity:.7;}
.exercise-meta{font-size:11px;color:var(--text-3);font-family:'DM Mono',monospace;white-space:nowrap;}

/* Last time chip */
.last-time-chip{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--text-2);margin-bottom:2px;}

/* Copy weights */
.copy-weights-btn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:7px;background:var(--accent-light);border:1px solid transparent;border-radius:var(--radius-sm);color:var(--accent);font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;}
.copy-weights-btn:hover{border-color:var(--accent);opacity:.85;}
.copy-weights-btn:disabled{opacity:.35;cursor:default;}

/* Set table */
.sets-header{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:5px;font-size:10px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;border-bottom:1px solid var(--border);font-family:'DM Sans',sans-serif;}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:5px;align-items:center;touch-action:pan-y;}
.set-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-3);text-align:center;}
.set-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 8px;font-size:13px;font-family:'DM Mono',monospace;color:var(--text);width:100%;text-align:center;outline:none;transition:border-color .15s;font-variant-numeric:tabular-nums;}
.set-input:focus{border-color:var(--accent);}
.set-input::placeholder{color:var(--text-3);}
.set-done{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;flex-shrink:0;justify-self:center;user-select:none;}
.set-done.checked{background:var(--accent);border-color:var(--accent);color:#fff;}
.set-row.swiping{background:var(--accent-light);border-radius:var(--radius-sm);}

/* Week compare */
.week-compare{padding:8px 10px;background:var(--surface2);border-radius:var(--radius-sm);font-size:12px;color:var(--text-2);display:flex;align-items:center;justify-content:space-between;gap:6px;}
.week-compare-left{display:flex;flex-direction:column;gap:2px;}
.week-compare-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);}
.week-compare-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);}
.week-compare-arrow{font-size:18px;color:var(--text-3);}
.week-compare.up .week-compare-arrow{color:var(--up);}
.week-compare.down .week-compare-arrow{color:var(--down);}

.add-set-btn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:7px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-3);font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;}
.add-set-btn:hover{border-color:var(--accent);color:var(--accent);}

.pr-chip{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:1px 6px;border-radius:20px;margin-left:5px;}
.pr-chip.up{background:var(--up-bg);color:var(--up);}
.pr-chip.same{background:var(--same-bg);color:var(--same);}
.pr-chip.down{background:var(--down-bg);color:var(--down);}

/* Note row */
.note-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;cursor:pointer;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.note-row-icon{font-size:16px;}
.note-row-label{font-size:14px;font-weight:500;color:var(--text-2);flex:1;}
.note-row-arrow{font-size:18px;color:var(--text-3);transition:transform .2s;}
.note-row.open .note-row-arrow{transform:rotate(90deg);}
.note-expanded{padding:0 0 8px;}
.session-note{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);resize:none;outline:none;transition:border-color .15s;line-height:1.45;box-shadow:var(--shadow-sm);}
.session-note:focus{border-color:var(--accent);}
.session-note::placeholder{color:var(--text-3);}
.note-save-btn{margin-top:6px;padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.note-save-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Save button */
.save-btn{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity .15s;letter-spacing:.02em;}
.save-btn:hover{opacity:.88;}
.save-btn:disabled{opacity:.4;cursor:default;}
.sticky-save{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:5;padding:10px 0 2px;background:linear-gradient(to bottom,transparent,var(--bg) 40%);}

.add-exercise-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:11px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius);color:var(--text-3);font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;margin-top:4px;}
.add-exercise-btn:hover{border-color:var(--accent);color:var(--accent);}
.delete-ex-btn{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px;padding:2px 4px;line-height:1;transition:color .15s;flex-shrink:0;}
.delete-ex-btn:hover{color:var(--down);}
.custom-badge{font-size:9px;background:var(--accent-light);color:var(--accent);padding:1px 5px;border-radius:20px;font-weight:500;margin-left:5px;vertical-align:middle;}

/* ── Bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;}
.nav-btn{flex:1;padding:10px 4px;border:none;background:none;color:var(--text-3);font-size:10px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s;letter-spacing:.04em;text-transform:uppercase;position:relative;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--accent);border-radius:2px;}
.nav-btn svg{width:18px;height:18px;}

/* ── View sections ── */
.history-section{display:none;}
.history-section.visible{display:block;}
.workout-section.hidden{display:none;}
.cardio-section{display:none;}
.cardio-section.visible{display:block;}

/* ── Page hero ── */
.page-hero{margin-bottom:16px;padding-top:4px;}
.page-hero-title{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:900;color:var(--text);line-height:1.1;}
.page-hero-sub{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-top:4px;}

/* ── Month nav card ── */
.month-nav-card{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
.month-nav-btn{background:none;border:none;font-size:20px;color:var(--text-2);cursor:pointer;padding:4px 8px;line-height:1;transition:color .15s;}
.month-nav-btn:hover{color:var(--accent);}
.month-nav-center{flex:1;text-align:center;}
.month-nav-label{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--text);}
.month-nav-sub{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-top:3px;}

/* ── Filter tabs ── */
.filter-tabs{display:flex;gap:8px;margin-bottom:14px;}
.filter-tab{padding:7px 18px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;}
.filter-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.filter-tab:hover:not(.active){border-color:var(--accent);color:var(--text);}

/* ── History cards ── */
.history-card-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;}
.history-card{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;user-select:none;}
.history-card-date{display:flex;flex-direction:column;align-items:center;min-width:36px;flex-shrink:0;}
.history-date-day-abbr{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);}
.history-date-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--text);line-height:1;}
.history-date-month{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);}
.history-card-main{flex:1;min-width:0;}
.history-card-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--text);line-height:1.2;}
.history-card-meta{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-3);margin-top:2px;}
.history-card-highlight{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-2);margin-top:4px;}
.history-card-arrow{font-size:18px;color:var(--text-3);transition:transform .2s;flex-shrink:0;}
.history-card-wrap.open .history-card-arrow{transform:rotate(90deg);}
.history-card-body{display:none;border-top:1px solid var(--border);}
.history-card-wrap.open .history-card-body{display:block;}
.history-expanded{padding:12px 16px 16px;}
.history-ex-table-header{display:grid;grid-template-columns:1fr 1fr 60px;gap:8px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding-bottom:8px;border-bottom:1px solid var(--border);font-family:'DM Sans',sans-serif;}
.history-ex-table-row{display:grid;grid-template-columns:1fr 1fr 60px;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);align-items:center;}
.history-ex-table-row:last-of-type{border-bottom:none;}
.history-tex-name{font-size:13px;font-weight:500;color:var(--text);}
.history-tex-best{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-2);}
.history-tex-done{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-3);}
.history-note-block{margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);border-left:2px solid var(--accent);}
.history-note-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:4px;}
.history-note-text{font-size:13px;color:var(--text-2);font-style:italic;}
.history-view-link{font-size:13px;font-weight:500;color:var(--accent);margin-top:12px;cursor:pointer;}

/* ── Volume section ── */
.vol-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
.vol-card-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.vol-card-title{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);}
.vol-card-sub{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text-3);}
.vol-week-label-top{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:10px;}
.vol-weeks-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.vol-week-tile{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center;position:relative;}
.vol-week-tile.current{background:var(--accent-light);border:1.5px solid var(--accent);}
.vol-tile-week{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-bottom:4px;}
.vol-tile-best{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);}

// ── Supabase ──────────────────────────────────────────────
async function dbq(table, params='') {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'}
    });
    if (!r.ok) throw new Error(await r.text());
    return await r.json();
  } catch(e){console.error(e);return null;}
}
async function dbupsert(table, data, conflict) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflict}`, {
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(data)
    });
    return r.ok;
  } catch(e){console.error(e);return false;}
}

function getWeekStart(offset=0){
  const now=new Date();const day=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-((day+6)%7)+(offset*7));

function getTabDates() {
  const now = new Date();
  const todayDow = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((todayDow + 6) % 7));
  const dayOffsets = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
  return PROGRAM.map(s => {
    const offset = dayOffsets[s.day] ?? 0;
    const d = new Date(monday);
    d.setDate(monday.getDate() + offset);
    return { day: s.day, date: d.getDate(), month: d.toLocaleString('en',{month:'short'}).toUpperCase() };
  });
}

async function loadDateLogs(date, target) {
  const data = await dbq('workout_logs',`?workout_date=eq.${date}&select=exercise_name,set_number,weight_kg,reps_done`);
  if (!data) return;
  const result={};
  for (const row of data) {
    if (!result[row.exercise_name]) result[row.exercise_name]=[];
    result[row.exercise_name][row.set_number-1]={weight:row.weight_kg||'',reps:row.reps_done||''};
  }
  if (target==='current') weekLogs=result;
  else prevWeekLogs=result;
}

function buildWorkout() {
  const session = PROGRAM[activeSession];
  const allEx = getExercises(activeSession);
  const savedNote = loadNote();
  const tabDates = getTabDates();
  const td = tabDates[activeSession];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const selD = new Date(selectedDate+'T12:00:00');
  const heroDate = `${dayNames[selD.getDay()]} ${selD.getDate()} ${monthNames[selD.getMonth()].toUpperCase()} ${selD.getFullYear()}`;

  const labelParts = session.label.split('·');
  const sessionName = labelParts[0].trim();
  const isGym = session.label.toLowerCase().includes('gym');
  const isHome = session.label.toLowerCase().includes('home');
  const locType = isGym ? 'GYM' : (isHome ? 'HOME' : 'GYM');
  const exCount = allEx.length;
  const heroMeta = `${exCount} EXERCISE${exCount!==1?'S':''} · ${locType}`;

  let html = `<div class="session-hero">
    <div class="session-hero-left">
      <h2 class="session-hero-name">${sessionName}</h2>
      <div class="session-hero-meta">${heroMeta}</div>
    </div>
    <div class="session-hero-date" id="session-hero-date">${heroDate}</div>
  </div>`;

  allEx.forEach((ex, ei) => {
    const isCustom = ei >= PROGRAM[activeSession].exercises.length;
    const isDone = completedExercises.has(ei);
    const prev = prevWeekLogs[ex.name] || [];
    const cur = weekLogs[ex.name] || [];
    const extraKey = `${session.id}-${ex.name}`;
    const loggedCount = cur.filter(Boolean).length;
    const totalSets = Math.max(ex.sets, loggedCount, extraSets[extraKey] || 0);
    const muscles = MUSCLES_MAP[ex.name] || (isCustom ? 'CUSTOM' : '');
    const badgeNum = ei + 1;

    const prevHasData = prev.some(s => s && (s.weight || s.reps));
    const copyBtn = prevHasData && !isDone
      ? `<button class="copy-weights-btn" id="copy-${ei}" onclick="copyLastWeek(${ei})">↙ Copy last week's weights</button>` : '';

    // Last time chip — best single set from prev week
    let lastTimeHtml = '';
    if (prev.length) {
      let bestSet = null;
      for (const s of prev) {
        if (!s) continue;
        if (!bestSet || (parseFloat(s.weight) > parseFloat(bestSet.weight))) bestSet = s;
      }
      if (bestSet && (bestSet.weight || bestSet.reps)) {
        const lt = bestSet.weight && bestSet.reps ? `${bestSet.weight}kg × ${bestSet.reps}` : (bestSet.weight ? `${bestSet.weight}kg` : `${bestSet.reps} reps`);
        lastTimeHtml = `<div class="last-time-chip">Last time: ${lt}</div>`;
      }
    }

    let setsHtml = '';
    for (let s = 0; s < totalSets; s++) {
      const c = cur[s] || {};
      setsHtml += `<div class="set-row" id="row-${ei}-${s}">
        <div class="set-num">${s+1}</div>
        <input class="set-input" type="number" inputmode="decimal" placeholder="kg" data-ei="${ei}" data-s="${s}" data-f="weight" value="${c.weight||''}">
        <input class="set-input" type="number" inputmode="numeric" placeholder="${ex.reps}" data-ei="${ei}" data-s="${s}" data-f="reps" value="${c.reps||''}">
        <div class="set-done${c.done?' checked':''}" data-ei="${ei}" data-s="${s}">${c.done?'✓':''}</div>
      </div>`;
    }

    // Week comparison
    const prevBest = prev.reduce((m,s) => s && parseFloat(s.weight) > m ? parseFloat(s.weight) : m, 0);
    const curBest = cur.reduce((m,s) => s && parseFloat(s.weight) > m ? parseFloat(s.weight) : m, 0);
    let compareHtml = '';
    if (prevBest > 0 && !isDone) {
      let cls = '', arrow = '→', chip = '';
      if (curBest > 0) {
        if (curBest > prevBest){cls='up';arrow='↑';chip=`<span class="pr-chip up">PR +${(curBest-prevBest).toFixed(1)}kg</span>`;}

        else{cls='down';arrow='↓';chip=`<span class="pr-chip down">↓${(prevBest-curBest).toFixed(1)}kg</span>`;}
      }
      compareHtml = `<div class="week-compare ${cls}" id="cmp-${ei}">
        <div class="week-compare-left"><div class="week-compare-label">Last week</div><div class="week-compare-val">${prevBest}kg</div></div>

      </div>`;

    const delBtn = isCustom && !isDone ? `<button class="delete-ex-btn" onclick="event.stopPropagation();delCustom('${ex.name.replace(/'/g,"\\'")}')">✕</button>` : '';

    const doneCount = cur.filter(s => s && (s.weight || s.reps)).length;
    const progressLabel = `${doneCount}/${totalSets} sets`;

    if (isDone) {

        <div class="swipe-reveal-label">Done</div>

  html += `<button class="add-exercise-btn" onclick="openModal()">+ Add exercise</button>
  <div class="note-row" id="note-row" onclick="toggleNote()">

function wireInputs(){

// ── Swipe-to-complete EXERCISE ─────────────────────────────
function wireExerciseSwipe(){
  document.querySelectorAll('.exercise-card-wrap').forEach(wrap=>{
    const card=wrap.querySelector('.exercise-card');
    if(!card)return;
    const ei=parseInt(card.id.replace('ex-',''));
    if(isNaN(ei))return;

    let startX=null,startY=null,dragging=false,currentX=0;
    const THRESHOLD=80;
    const REVEAL_START=40;

    function onTouchStart(e){
      startX=e.touches[0].clientX;startY=e.touches[0].clientY;
      dragging=false;currentX=0;card.style.transition='none';
    }
    function onTouchMove(e){
      if(startX===null)return;
      const dx=e.touches[0].clientX-startX;
      const dy=Math.abs(e.touches[0].clientY-startY);
      if(!dragging&&Math.abs(dx)<10)return;
      if(!dragging&&dy>Math.abs(dx))return;
      dragging=true;
      if(dx>=0){card.style.transform='';return;}
      currentX=dx;
      card.style.transform=`translateX(${Math.max(dx,-200)}px)`;
      const reveal=document.getElementById(`reveal-${ei}`);
      if(reveal){reveal.style.opacity=Math.max(0,(Math.abs(dx)-REVEAL_START)/(THRESHOLD-REVEAL_START)).toFixed(2);}
      if(e.cancelable)e.preventDefault();
    }
    function onTouchEnd(){
      if(startX===null)return;startX=null;
      if(!dragging){return;}dragging=false;
      const reveal=document.getElementById(`reveal-${ei}`);
      if(Math.abs(currentX)>=THRESHOLD){
        completeExercise(ei,wrap,card,reveal);
      } else {
        card.style.transition='transform .2s ease';card.style.transform='';
        if(reveal)reveal.style.opacity='0';
      }
    }

    card.addEventListener('touchstart',onTouchStart,{passive:true});
    card.addEventListener('touchmove',onTouchMove,{passive:false});
    card.addEventListener('touchend',onTouchEnd);
  });
}

async function completeExercise(ei,wrap,card,reveal){
  const ex=getExercises(activeSession)[ei];
  const session=PROGRAM[activeSession];
  const sets=weekLogs[ex.name]||[];
  const totalSets=Math.max(ex.sets,sets.filter(Boolean).length);
  const rows=[];
  for(let s=0;s<totalSets;s++){
    const set=sets[s]||{};
    if(set.weight||set.reps){
      rows.push({workout_date:dateKey(),session_label:session.label,exercise_name:ex.name,set_number:s+1,weight_kg:parseFloat(set.weight)||null,reps_done:parseInt(set.reps)||null});
    }
  }

  card.style.transition='transform .22s ease, opacity .22s ease';
  card.style.transform='translateX(-110%)';card.style.opacity='0';
  if(reveal){reveal.style.opacity='0';reveal.style.transition='opacity .15s';}

  if(rows.length){dbupsert('workout_logs',rows,'workout_date,exercise_name,set_number');}

  setTimeout(()=>{
    completedExercises.add(ei);
    const cur=weekLogs[ex.name]||[];
    const setsSummary=cur.filter(Boolean).map(x=>{
      if(x.weight&&x.reps)return`${x.weight}×${x.reps}`;
      if(x.weight)return`${x.weight}kg`;
      if(x.reps)return`${x.reps}r`;
      return'—';
    }).join(' · ');
    const doneWrap=document.createElement('div');
    doneWrap.className='exercise-card-wrap';
    doneWrap.innerHTML=`<div class="exercise-card done-card">
      <div class="exercise-header">
        <div class="ex-num-badge" style="background:var(--up-bg);color:var(--up);border-color:var(--up-bg)">✓</div>
        <div class="ex-header-info">
          <div class="exercise-name" style="opacity:.6">${ex.name}</div>
          <div class="exercise-muscles">${MUSCLES_MAP[ex.name]||'CUSTOM'}</div>
        </div>
        <div class="ex-header-right"><div class="ex-sets-label" style="font-size:11px;color:var(--text-3)">${setsSummary||'—'}</div></div>
        <div class="done-badge">✓ Done</div>
      </div>
    </div>`;
    doneWrap.style.opacity='0';doneWrap.style.transform='translateY(-6px)';
    wrap.replaceWith(doneWrap);
    requestAnimationFrame(()=>{
      doneWrap.style.transition='opacity .2s,transform .2s';
      doneWrap.style.opacity='1';doneWrap.style.transform='translateY(0)';
    });
    if(rows.length)showToast(`${ex.name} saved ✓`);else showToast(`${ex.name} done`);
  },240);
}

function wireSetDone(btn){
  btn.addEventListener('click',e=>{
    const ei=+e.target.dataset.ei,s=+e.target.dataset.s;
    const name=getExercises(activeSession)[ei].name;
    if(!weekLogs[name])weekLogs[name]=[];
    if(!weekLogs[name][s])weekLogs[name][s]={};
    const done=!weekLogs[name][s].done;
    weekLogs[name][s].done=done;
    e.target.classList.toggle('checked',done);
    e.target.textContent=done?'✓':'';
  });
}

function addSwipe(el){
  let startX=null;
  const row=el.closest('.set-row');
  el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;},{passive:true});
  el.addEventListener('touchmove',e=>{
    if(startX===null)return;
    const dx=e.touches[0].clientX-startX;
    if(dx>30&&row)row.classList.add('swiping');
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(startX===null)return;
    const dx=e.changedTouches[0].clientX-startX;
    if(row)row.classList.remove('swiping');
    if(dx>50){el.click();}
    startX=null;
  });
}

function copyLastWeek(ei){
  const ex=getExercises(activeSession)[ei];
  const prev=prevWeekLogs[ex.name]||[];
  if(!weekLogs[ex.name])weekLogs[ex.name]=[];
  prev.forEach((p,s)=>{
    if(!p)return;
    if(!weekLogs[ex.name][s])weekLogs[ex.name][s]={};
    weekLogs[ex.name][s].weight=p.weight;weekLogs[ex.name][s].reps=p.reps;
    const wInp=document.querySelector(`.set-input[data-ei="${ei}"][data-s="${s}"][data-f="weight"]`);
    const rInp=document.querySelector(`.set-input[data-ei="${ei}"][data-s="${s}"][data-f="reps"]`);
    if(wInp)wInp.value=p.weight||'';if(rInp)rInp.value=p.reps||'';
  });
  updateCompare(ei);
  const btn=document.getElementById(`copy-${ei}`);
  if(btn){btn.textContent='✓ Copied';btn.disabled=true;setTimeout(()=>{btn.textContent='↙ Copy last week\'s weights';btn.disabled=false;},1800);}
}

function addSet(ei){
  const session=PROGRAM[activeSession];
  const ex=getExercises(activeSession)[ei];
  const extraKey=`${session.id}-${ex.name}`;
  const cur=weekLogs[ex.name]||[];
  const loggedCount=cur.filter(Boolean).length;
  const currentTotal=Math.max(ex.sets,loggedCount,extraSets[extraKey]||0);
  extraSets[extraKey]=currentTotal+1;
  const newS=currentTotal;
  const list=document.getElementById(`sets-${ei}`);
  const row=document.createElement('div');
  row.className='set-row';row.id=`row-${ei}-${newS}`;
  row.innerHTML=`
    <div class="set-num">${newS+1}</div>
    <input class="set-input" type="number" inputmode="decimal" placeholder="kg" data-ei="${ei}" data-s="${newS}" data-f="weight" value="">
    <input class="set-input" type="number" inputmode="numeric" placeholder="${ex.reps}" data-ei="${ei}" data-s="${newS}" data-f="reps" value="">
    <div class="set-done" data-ei="${ei}" data-s="${newS}"></div>`;
  list.appendChild(row);
  row.querySelectorAll('.set-input').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const eiN=+e.target.dataset.ei,sN=+e.target.dataset.s,f=e.target.dataset.f;
      const name=getExercises(activeSession)[eiN].name;
      if(!weekLogs[name])weekLogs[name]=[];
      if(!weekLogs[name][sN])weekLogs[name][sN]={};
      weekLogs[name][sN][f]=e.target.value;updateCompare(eiN);
    });
  });
  const doneBtn=row.querySelector('.set-done');
  wireSetDone(doneBtn);addSwipe(doneBtn);
}

function updateCompare(ei){
  const ex=getExercises(activeSession)[ei];
  const cur=weekLogs[ex.name]||[];const prev=prevWeekLogs[ex.name]||[];
  const prevBest=prev.reduce((m,s)=>s&&parseFloat(s.weight)>m?parseFloat(s.weight):m,0);
  const curBest=cur.reduce((m,s)=>s&&parseFloat(s.weight)>m?parseFloat(s.weight):m,0);
  const el=document.getElementById(`cmp-${ei}`);
  if(!el||prevBest===0)return;
  let cls='',arrow='→',chip='';
  if(curBest>0){
    if(curBest>prevBest){cls='up';arrow='↑';chip=`<span class="pr-chip up">PR +${(curBest-prevBest).toFixed(1)}kg</span>`;}
    else if(curBest===prevBest){cls='same';arrow='=';chip=`<span class="pr-chip same">Same</span>`;}
    else{cls='down';arrow='↓';chip=`<span class="pr-chip down">↓${(prevBest-curBest).toFixed(1)}kg</span>`;}
  }
  el.className=`week-compare ${cls}`;
  el.innerHTML=`
    <div class="week-compare-left"><div class="week-compare-label">Last week</div><div class="week-compare-val">${prevBest}kg</div></div>
    <div class="week-compare-arrow">${arrow}</div>
    <div class="week-compare-left" style="text-align:right"><div class="week-compare-label">This week ${chip}</div><div class="week-compare-val">${curBest>0?curBest+'kg':'—'}</div></div>`;
}

// ── History ───────────────────────────────────────────────
async function buildHistory(){
  const weekStart=getWeekStart(historyWeekOffset);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);
  // Month label
  const ws=new Date(weekStart+'T12:00:00');
  const monthNames2=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthLabel=`${monthNames2[ws.getMonth()]} ${ws.getFullYear()}`;
  document.getElementById('history-week-label').textContent=monthLabel;

  const endKey=new Date(weekStart);endKey.setDate(endKey.getDate()+7);
  const endStr=endKey.toISOString().slice(0,10);

  const [data,prevData]=await Promise.all([
    dbq('workout_logs',`?workout_date=gte.${weekStart}&workout_date=lt.${endStr}&select=exercise_name,set_number,weight_kg,reps_done,session_label,workout_date&order=workout_date`),
    dbq('workout_logs',`?workout_date=gte.${getWeekStart(historyWeekOffset-1)}&workout_date=lt.${weekStart}&select=exercise_name,weight_kg,reps_done,workout_date`)
  ]);

  const rows=data||[];
  window._lastHistoryRows=rows;
  const prevRows=prevData||[];

  const prevBests={};
  for(const r of prevRows){
    if(!prevBests[r.exercise_name]||r.weight_kg>prevBests[r.exercise_name])prevBests[r.exercise_name]=r.weight_kg;
  }

  // Group by date + session
  const bySession={};
  for(const r of rows){
    const k=`${r.workout_date}|${r.session_label}`;
    if(!bySession[k])bySession[k]={date:r.workout_date,label:r.session_label,exercises:{}};
    if(!bySession[k].exercises[r.exercise_name])bySession[k].exercises[r.exercise_name]=[];
    bySession[k].exercises[r.exercise_name].push(r);
  }

  const workoutCount=Object.keys(bySession).length;
  document.getElementById('history-month-sub').textContent=`${workoutCount} workout${workoutCount!==1?'s':''}`;

  let html='';
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  if(!Object.keys(bySession).length){
    html='<div class="empty-state">No workouts logged this week</div>';
  } else {
    const sorted=Object.entries(bySession).sort((a,b)=>b[1].date.localeCompare(a[1].date));
    sorted.forEach(([,s],idx)=>{
      // Filter
      if(historyFilter==='cardio') return; // cardio not in db
      const d=new Date(s.date+'T12:00:00');
      const dayAbbr=dayNames[d.getDay()];
      const dayNum=d.getDate();
      const monthAbbr=monthNames[d.getMonth()];

      // Best set for highlight
      let bestW=0, bestR=0, bestEx='';
      for(const [exName,sets] of Object.entries(s.exercises)){
        for(const x of sets){
          if((x.weight_kg||0)>(bestW)){bestW=x.weight_kg||0;bestR=x.reps_done||0;bestEx=exName;}
        }
      }
      const highlightText=bestW>0?`${bestEx.split(' ').slice(0,2).join(' ')} ${bestW}kg × ${bestR}`:'';
      const exCount2=Object.keys(s.exercises).length;

      // Expanded table rows
      let exTableRows='';
      for(const [exName,sets] of Object.entries(s.exercises)){
        const sorted2=sets.sort((a,b)=>a.set_number-b.set_number);
        const best2=sorted2.reduce((m,x)=>x.weight_kg>m?x.weight_kg:m,0);
        const bestReps2=sorted2.find(x=>x.weight_kg===best2)?.reps_done||'—';
        const bestStr=best2>0?`${best2} kg × ${bestReps2}`:'—';
        const doneCount2=sorted2.filter(x=>x.weight_kg||x.reps_done).length;
        exTableRows+=`<div class="history-ex-table-row">
          <span class="history-tex-name">${exName}</span>
          <span class="history-tex-best">${bestStr}</span>
          <span class="history-tex-done">${doneCount2}/${sorted2.length}</span>
        </div>`;
      }

      const noteStorageKey=`note-${PROGRAM.find(p=>p.label===s.label)?.id||''}-${s.date}`;
      let noteHtml='';
      try{const n=localStorage.getItem(noteStorageKey);if(n)noteHtml=`<div class="history-note-block"><div class="history-note-label">Notes</div><div class="history-note-text">${n}</div></div>`;}catch{}

      html+=`<div class="history-card-wrap" id="hday-${idx}" onclick="toggleHistoryDay(this)">
        <div class="history-card">
          <div class="history-card-date">
            <div class="history-date-day-abbr">${dayAbbr}</div>
            <div class="history-date-num">${dayNum}</div>
            <div class="history-date-month">${monthAbbr}</div>
          </div>
          <div class="history-card-main">
            <div class="history-card-name">${s.label.split('·')[0].trim()}</div>
            <div class="history-card-meta">${s.label.includes('GYM')||s.label.includes('Glutes')||s.label.includes('Back')||s.label.includes('Shoulder') ? 'Gym' : 'Gym'} · ${exCount2} exercise${exCount2!==1?'s':''}</div>
            ${highlightText?`<div class="history-card-highlight">${highlightText}</div>`:''}
          </div>
          <div class="history-card-arrow">›</div>
        </div>
        <div class="history-card-body">
          <div class="history-expanded">
            <div class="history-ex-table-header"><span>EXERCISE</span><span>BEST SET</span><span>COMPLETED</span></div>
            ${exTableRows}
            ${noteHtml}
            <div class="history-view-link">View full session →</div>
          </div>
        </div>
      </div>`;
    });
  }

  if(historyFilter==='cardio'){
    const cardioLogs=loadCardioLogs();
    if(!cardioLogs.length){html='<div class="empty-state">No cardio logged</div>';}
    else{
      const ws2=getWeekStart(historyWeekOffset);const we2=new Date(ws2);we2.setDate(we2.getDate()+7);const weStr2=we2.toISOString().slice(0,10);
      const weekC=cardioLogs.filter(l=>l.date>=ws2&&l.date<weStr2);
      if(!weekC.length){html='<div class="empty-state">No cardio this week</div>';}
      else{html=weekC.reverse().map(l=>{
        const cd=new Date(l.date+'T12:00:00');
        return `<div class="history-card-wrap">
          <div class="history-card">
            <div class="history-card-date">
              <div class="history-date-day-abbr">${dayNames[cd.getDay()]}</div>
              <div class="history-date-num">${cd.getDate()}</div>
              <div class="history-date-month">${monthNames[cd.getMonth()]}</div>
            </div>
            <div class="history-card-main">
              <div class="history-card-name">${l.type}</div>

// ── Volume tab ────────────────────────────────────────────
async function buildVolumeTab(){
  const weekStart=getWeekStart(historyWeekOffset);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ws=new Date(weekStart+'T12:00:00');
  const we=new Date(weekEnd.toISOString().slice(0,10)+'T12:00:00');
  document.getElementById('vol-week-label').textContent=`${monthNames[ws.getMonth()]} ${ws.getDate()} – ${ws.getMonth()===we.getMonth()?'':monthNames[we.getMonth()]+' '}${we.getDate()}`;

  const endKey=new Date(weekStart);endKey.setDate(endKey.getDate()+7);
  const endStr=endKey.toISOString().slice(0,10);
  const prev1Start=getWeekStart(historyWeekOffset-1);
  const prev2Start=getWeekStart(historyWeekOffset-2);

  const [data,prev1Data,prev2Data]=await Promise.all([
    dbq('workout_logs',`?workout_date=gte.${weekStart}&workout_date=lt.${endStr}&select=exercise_name,set_number,weight_kg,reps_done,session_label,workout_date&order=workout_date`),
    dbq('workout_logs',`?workout_date=gte.${prev1Start}&workout_date=lt.${weekStart}&select=exercise_name,weight_kg,reps_done,workout_date`),
    dbq('workout_logs',`?workout_date=gte.${prev2Start}&workout_date=lt.${prev1Start}&select=exercise_name,weight_kg,reps_done,workout_date`)
  ]);

  window._lastHistoryRows=data||[];

  // Populate select on first call
  const sel=document.getElementById('vol-ex-select');
  if(sel&&sel.options.length<=1){
    const allNames=[];
    PROGRAM.forEach(s=>s.exercises.forEach(e=>{if(!allNames.includes(e.name))allNames.push(e.name);}));
    allNames.sort();
    sel.innerHTML=allNames.map(n=>`<option value="${n}">${n}</option>`).join('');
  }

  const selectedEx=sel?sel.value:'';
  const rows=data||[];
  const pr1=prev1Data||[];
  const pr2=prev2Data||[];

  // This week best set for selected exercise
  function bestSetForEx(arr,exName){
    const ex=arr.filter(r=>r.exercise_name===exName);
    if(!ex.length)return null;
    return ex.reduce((best,r)=>{
      if(!best||((r.weight_kg||0)>(best.weight_kg||0)))return r;
      return best;
    },null);
  }

  const thisWeekBest=selectedEx?bestSetForEx(rows,selectedEx):null;
  const prev1Best=selectedEx?bestSetForEx(pr1,selectedEx):null;
  const prev2Best=selectedEx?bestSetForEx(pr2,selectedEx):null;

  function tileStr(best){
    if(!best)return'—';
    if(best.weight_kg&&best.reps_done)return`${best.weight_kg}kg × ${best.reps_done}`;
    if(best.weight_kg)return`${best.weight_kg}kg`;
    return'—';
  }

  function weekRangeStr(offset){
    const s=getWeekStart(historyWeekOffset+offset);
    const e=new Date(s+'T12:00:00');e.setDate(e.getDate()+6);
    const ws2=new Date(s+'T12:00:00');
    return `${monthNames[ws2.getMonth()]} ${ws2.getDate()} – ${e.getDate()}`;
  }

  let deltaStr='';
  if(thisWeekBest&&prev1Best&&thisWeekBest.weight_kg&&prev1Best.weight_kg){
    const d=(thisWeekBest.weight_kg-prev1Best.weight_kg);
    if(d>0)deltaStr=`<div class="vol-tile-trend" style="color:var(--up)">+${d}kg vs last week</div>`;
    else if(d<0)deltaStr=`<div class="vol-tile-trend" style="color:var(--down)">${d}kg vs last week</div>`;
    else deltaStr=`<div class="vol-tile-trend" style="color:var(--same)">= same as last week</div>`;
  }

  const weeksHtml=`
    <div class="vol-week-tile">
      <div class="vol-tile-week">${weekRangeStr(-2)}</div>
      <div class="vol-tile-best">${tileStr(prev2Best)}</div>
    </div>
    <div class="vol-week-tile">
      <div class="vol-tile-week">${weekRangeStr(-1)}</div>
      <div class="vol-tile-best">${tileStr(prev1Best)}</div>
    </div>
    <div class="vol-week-tile current">
      <div class="vol-tile-badge">THIS WEEK</div>
      <div class="vol-tile-week">${weekRangeStr(0)}</div>
      <div class="vol-tile-best">${tileStr(thisWeekBest)}</div>
      ${deltaStr}
    </div>`;

  // All sets this week for selected ex
  const thisSets=selectedEx?rows.filter(r=>r.exercise_name===selectedEx).sort((a,b)=>a.workout_date.localeCompare(b.workout_date)||a.set_number-b.set_number):[];
  const dayNames2=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const setsTableRows=thisSets.map(r=>{
    const d=new Date(r.workout_date+'T12:00:00');
    return `<div class="vol-set-row">
      <span>${dayNames2[d.getDay()]} ${d.getDate()} ${monthNames[d.getMonth()]}</span>
      <span>Set ${r.set_number}</span>
      <span>${r.weight_kg||'—'} kg</span>
      <span>${r.reps_done||'—'}</span>
    </div>`;
  }).join('');

  // Other lifts this week
  const otherExNames=[...new Set(rows.map(r=>r.exercise_name))].filter(n=>n!==selectedEx);
  const otherRows=otherExNames.map(n=>{
    const tw=bestSetForEx(rows,n);
    const lw=bestSetForEx(pr1,n);
    const twStr=tileStr(tw);
    const lwStr=lw?tileStr(lw):'—';
    return `<div class="vol-other-row">
      <span class="vol-other-name">${n}</span>
      <span class="vol-other-val">${lwStr !== '—' ? lwStr+' → ' : ''}${twStr}</span>
      <span class="vol-other-arrow">›</span>
    </div>`;
  }).join('');

  document.getElementById('vol-content').innerHTML=`
    <div class="vol-card">
      <div class="vol-week-label-top">WEEKLY BEST SET</div>
      <div class="vol-weeks-row">${weeksHtml}</div>
    </div>
    <div class="vol-card">
      <div class="vol-card-header">
        <span class="vol-card-title">ALL SETS THIS WEEK</span>
        ${selectedEx?`<span class="vol-card-sub">${selectedEx}</span>`:''}
      </div>
      <div class="vol-sets-table-header"><span>DATE</span><span>SET</span><span>WEIGHT</span><span>REPS</span></div>
      <div id="vol-sets-body">${setsTableRows||'<div class="empty-state" style="padding:20px 0">No sets logged this week</div>'}</div>
    </div>
    ${otherRows?`<div class="vol-card">
      <div class="vol-card-header">
        <span class="vol-card-title">OTHER LIFTS</span>
        <span class="vol-card-sub">Best set, last → this week</span>
      </div>
      <div id="vol-other-lifts">${otherRows}</div>
    </div>`:''}
  `;
}

function filterVolExercises(){
  const q=(document.getElementById('vol-search').value||'').toLowerCase();
  const sel=document.getElementById('vol-ex-select');
  if(!sel)return;
  Array.from(sel.options).forEach(o=>{
    o.style.display=o.value.toLowerCase().includes(q)?'':'none';
  });
  // Select first visible
  const first=Array.from(sel.options).find(o=>o.style.display!=='none');
  if(first)sel.value=first.value;
  buildVolumeTab();
}

// ── Volume chart (kept for compat) ────────────────────────
function drawVolumeChart(rows,weekStart){
  const canvas=document.getElementById('vol-chart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||2;
  const W=canvas.offsetWidth||300;const H=140;
  canvas.width=W*dpr;canvas.height=H*dpr;ctx.scale(dpr,dpr);
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const vols=new Array(7).fill(0);
  for(const r of rows){
    const d=new Date(r.workout_date+'T12:00:00');
    const ws=new Date(weekStart+'T12:00:00');
    const diff=Math.round((d-ws)/86400000);
    if(diff>=0&&diff<7&&r.weight_kg&&r.reps_done)vols[diff]+=(r.weight_kg*r.reps_done);
  }
  const maxVol=Math.max(...vols,1);
  const clrAccent='#7B1F2E';const clrEmpty='#F0EBE1';const clrText2='#6B5E4E';const clrText3='#9E8E7E';
  const padL=4,padR=4,padT=20,padB=22;
  const chartW=W-padL-padR;const chartH=H-padT-padB;
  const slotW=chartW/7;const barW=Math.max(8,Math.floor(slotW*0.55));const gapX=(slotW-barW)/2;
  ctx.clearRect(0,0,W,H);
  vols.forEach((v,i)=>{
    const x=padL+i*slotW+gapX;const barH=v>0?Math.max(6,Math.round((v/maxVol)*chartH)):3;const y=padT+chartH-barH;const rad=4;
    ctx.fillStyle=v>0?clrAccent:clrEmpty;ctx.beginPath();
    if(v>0){
      ctx.moveTo(x+rad,y);ctx.lineTo(x+barW-rad,y);ctx.arcTo(x+barW,y,x+barW,y+rad,rad);
      ctx.lineTo(x+barW,y+barH);ctx.lineTo(x,y+barH);ctx.lineTo(x,y+rad);ctx.arcTo(x,y,x+rad,y,rad);
    } else {ctx.rect(x,padT+chartH-3,barW,3);}
    ctx.fill();
    ctx.fillStyle=clrText3;ctx.font=`500 9px DM Sans,system-ui`;ctx.textAlign='center';ctx.fillText(days[i],x+barW/2,H-5);
    if(v>0){const label=v>=1000?`${(v/1000).toFixed(1)}k`:`${Math.round(v)}`;ctx.fillStyle=clrText2;ctx.font=`500 9px DM Mono,monospace`;ctx.fillText(label,x+barW/2,y-5);}
  });
}

// ── Cardio ────────────────────────────────────────────────
const CARDIO_TYPES=['Treadmill','Incline Walk','Run','Bike','Stairmaster','Other'];
let cardioType='Treadmill';

function loadCardioLogs(){try{return JSON.parse(localStorage.getItem('cardio-logs')||'[]');}catch{return[];}}
function saveCardioLogs(logs){try{localStorage.setItem('cardio-logs',JSON.stringify(logs));}catch{}}

function buildCardio(){
  const logs=loadCardioLogs();
  const ws=getWeekStart(0);const we=new Date(ws);we.setDate(we.getDate()+7);const weStr=we.toISOString().slice(0,10);
  const weekLogs2=logs.filter(l=>l.date>=ws&&l.date<weStr);
  const weekMins=weekLogs2.reduce((s,l)=>s+(parseFloat(l.duration)||0),0);
  const weekKm=weekLogs2.reduce((s,l)=>s+(parseFloat(l.distance)||0),0);
  const typeButtons=CARDIO_TYPES.map(t=>`<button class="cardio-type-btn${t===cardioType?' active':''}" onclick="setCardioType('${t}')">${t}</button>`).join('');
  const weekTotalHtml=weekMins>0?`<div class="cardio-week-total"><div class="cardio-week-total-label">This week</div><div class="cardio-week-total-val">${weekMins} min${weekKm>0?' · '+weekKm.toFixed(1)+' km':''}</div></div>`:'';
  const logCards=logs.slice().reverse().slice(0,20).map((l,ri)=>{
    const i=logs.length-1-ri;
    const stats=[
      l.duration?`<div class="cardio-stat"><div class="cardio-stat-val">${l.duration}</div><div class="cardio-stat-label">min</div></div>`:'',
      l.distance?`<div class="cardio-stat"><div class="cardio-stat-val">${l.distance}</div><div class="cardio-stat-label">km</div></div>`:'',
      l.speed?`<div class="cardio-stat"><div class="cardio-stat-val">${l.speed}</div><div class="cardio-stat-label">km/h</div></div>`:'',
      l.incline?`<div class="cardio-stat"><div class="cardio-stat-val">${l.incline}%</div><div class="cardio-stat-label">incline</div></div>`:'',
    ].join('');
    return `<div class="cardio-log-card"><div class="cardio-log-left"><div class="cardio-log-type">${l.type}</div><div class="cardio-log-date">${l.date}</div><div class="cardio-log-stats">${stats}</div></div><button class="cardio-delete" onclick="deleteCardio(${i})">✕</button></div>`;
  }).join('');
  document.getElementById('cardio-content').innerHTML=`
    ${weekTotalHtml}
    <div class="cardio-form">
      <div class="cardio-form-title">Log cardio</div>
      <div class="cardio-type-row">${typeButtons}</div>
      <div class="cardio-fields">
        <div class="cardio-field"><label class="cardio-label">Duration (min)</label><input class="cardio-input" id="c-duration" type="number" inputmode="decimal" placeholder="30"></div>
        <div class="cardio-field"><label class="cardio-label">Distance (km)</label><input class="cardio-input" id="c-distance" type="number" inputmode="decimal" placeholder="3.5"></div>
        <div class="cardio-field"><label class="cardio-label">Speed (km/h)</label><input class="cardio-input" id="c-speed" type="number" inputmode="decimal" placeholder="8.0"></div>
        <div class="cardio-field"><label class="cardio-label">Incline (%)</label><input class="cardio-input" id="c-incline" type="number" inputmode="decimal" placeholder="1.0"></div>
        <div class="cardio-field full"><label class="cardio-label">Date</label><input class="cardio-input" id="c-date" type="date" value="${selectedDate}"></div>
      </div>
      <button class="save-btn" onclick="saveCardio()">Log session <span style="float:right">→</span></button>
    </div>
    <div class="cardio-log-list">${logCards||'<div class="empty-state">No cardio logged yet</div>'}</div>`;
}

function setCardioType(t){cardioType=t;document.querySelectorAll('.cardio-type-btn').forEach(b=>b.classList.toggle('active',b.textContent===t));}
function saveCardio(){
  const duration=document.getElementById('c-duration').value.trim();const distance=document.getElementById('c-distance').value.trim();
  const speed=document.getElementById('c-speed').value.trim();const incline=document.getElementById('c-incline').value.trim();
  const date=document.getElementById('c-date').value||selectedDate;
  if(!duration&&!distance){showToast('Enter duration or distance');return;}
  const logs=loadCardioLogs();logs.push({type:cardioType,date,duration,distance,speed,incline});
  saveCardioLogs(logs);showToast('Cardio logged ✓');buildCardio();
}
function deleteCardio(i){const logs=loadCardioLogs();logs.splice(i,1);saveCardioLogs(logs);buildCardio();}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

async function switchView(view){
  activeView=view;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`nav-${view}`).classList.add('active');
  document.getElementById('workout-section').classList.toggle('hidden',view!=='workout');
  document.getElementById('history-section').classList.toggle('visible',view==='history');
  document.getElementById('volume-section').classList.toggle('visible',view==='volume');
  document.getElementById('cardio-section').classList.toggle('visible',view==='cardio');
  if(view==='history')await buildHistory();
  if(view==='cardio')buildCardio();
  if(view==='volume')buildVolumeTab();
}

async function init(){
  document.getElementById('workout-date').value=selectedDate;
  const tabDates=getTabDates();
  const tabs=document.getElementById('session-tabs');
  tabs.innerHTML=PROGRAM.map((s,i)=>{
    const td=tabDates[i];
    const namePart=s.label.split('·')[0].trim().split(' ').slice(0,2).join(' ');
    return `<button class="session-tab${i===activeSession?' active':''}" onclick="selectSession(${i})">
      <span class="tab-day-abbr">${s.day}</span>
      <span class="tab-day-num">${td.date}</span>
      <span class="tab-session-name">${namePart}</span>
    </button>`;
  }).join('');
  await Promise.all([loadDateLogs(selectedDate,'current'),loadDateLogs(prevSameDate(),'prev')]);
  buildWorkout();
  setTimeout(()=>{const sp=document.getElementById('splash');sp.classList.add('fade-out');setTimeout(()=>sp.classList.add('gone'),650);},1600);
}

function autoSelectToday(){
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=days[new Date().getDay()];
  const idx=PROGRAM.findIndex(p=>p.day===today);
  if(idx>=0)activeSession=idx;
}
